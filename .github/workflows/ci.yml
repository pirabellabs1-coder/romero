name: CI

# Run on every push and PR so a build break never reaches production
# without surfacing in the GitHub UI first. Independent of Vercel — this
# is the safety net catching TypeScript errors, lint errors, and build
# failures BEFORE we hit "vercel --prod".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint + Type-check + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        # The build step exercises ALL pages — broken imports, runtime
        # errors in server components, missing env vars surface here.
        run: npm run build
        env:
          # Dummy values just to satisfy any "required env" checks during
          # the build. Real values come from Vercel at runtime.
          NEXT_PUBLIC_SITE_URL: https://example.com
          AUTH_SECRET: ci-test-secret-not-used-in-prod
          MAIL_TO: ci@example.com
          MAIL_FROM: ci@example.com
          RESEND_API_KEY: ci-fake-key

  smoke:
    name: Playwright smoke tests against prod
    runs-on: ubuntu-latest
    needs: build
    # Only smoke-test on pushes to main, not on PRs — PRs may be
    # against a different deploy URL.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Wait for Vercel deploy to settle
        # Vercel typically finishes a deploy ~30-60s after the push lands.
        run: sleep 90

      - name: Run smoke tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://romero-photography.vercel.app
          CI: "true"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
